version: "3.9"

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet
    ports:
      - "5482:5432"

  # Emulador oficial do Azure Storage (Blob, Queue e Table) — dispensa conta no Azure.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      - appnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      SEED_DEMO: "true"
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: app_db
      JWT_SECRET: supersegredo123
      # Blob (comprovantes) + Queue (notificações). Padrão: Azurite deste compose.
      # Para usar a Storage Account do Azure: AZURE_STORAGE_CONNECTION_STRING="..." docker compose up
      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING:-UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite}"
    ports:
      - "3000:3000"
    networks:
      - appnet
    volumes:
      - ./backend/uploads:/usr/src/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - appnet
    volumes:
      - ./backend/uploads:/usr/share/nginx/html/uploads

volumes:
  db-data:

networks:
  appnet:
    driver: bridge
